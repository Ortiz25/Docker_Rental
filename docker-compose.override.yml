version: '3.8'

services:
  frontend:
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./Rentalmgt-frontend:/app
      - /app/node_modules

  backend:
    command: npm run dev
    ports:
      - "5000:5000"
    volumes:
      - ./Rentalmgt--backend:/app
      - /app/node_modules