version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ./Rental-frontend
      dockerfile: Dockerfile
    container_name: rental-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:5000
    volumes:
      - ./Rental-frontend:/app
      - /app/node_modules
    networks:
      - rental-network

  # Backend Service
  backend:
    build:
      context: ./Rental-Backend
      dockerfile: Dockerfile
    container_name: rental-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-rental_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret}
    volumes:
      - ./Rental-Backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - rental-network

  # Database Service
  postgres:
    image: postgres:14-alpine
    container_name: rental-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rental_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./upgradedDB.txt:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rental-network

  # PGAdmin (Optional)
  pgadmin:
    image: dpage/pgadmin4
    container_name: rental-pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - rental-network

networks:
  rental-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
