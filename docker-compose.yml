version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ./Rental-frontend
      dockerfile: Dockerfile
      target: production
    container_name: rental-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:5000
    networks:
      - rental-network

  # Backend Service
  backend:
    build:
      context: ./Rental-Backend
      dockerfile: Dockerfile
      target: production
    container_name: rental-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-rental_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret}
    depends_on:
      - postgres
    networks:
      - rental-network

  # Database Service
  postgres:
    image: postgres:14-alpine
    container_name: rental-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-rental_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./upgradedDB.txt:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rental-network

networks:
  rental-network:
    driver: bridge

volumes:
  postgres_data: