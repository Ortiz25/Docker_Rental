# Rate limiting for login attempts
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream definitions for load balancing (if needed in the future)
upstream frontend {
    server frontend:80;
    keepalive 32;
}

upstream backend {
    server backend:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';";
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
    
    # Remove server version
    server_tokens off;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options nosniff;

    # ========== FRONTEND ==========
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Cache control
        expires 1h;
        add_header Cache-Control "public, no-transform";
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Enable gzip for all text-based content
        gzip on;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }

    # ========== BACKEND API ==========
    location /backend/ {
        # Rate limiting for API endpoints
        limit_req zone=login burst=5 nodelay;
        
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Don't cache API responses by default
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Frame-Options "DENY" always;
    }
    
    # ========== HEALTH CHECKS ==========
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'Healthy\n';
    }
    
    # ========== ERROR PAGES ==========
    error_page 400 401 402 403 404 405 406 407 408 409 410 411 412 413 414 415 416 417 418 421 422 423 424 425 426 428 429 431 451 500 501 502 503 504 505 506 507 508 510 511 /error.html;
    
    location = /error.html {
        internal;
        root /usr/share/nginx/html;
    }
    
    # ========== SECURITY ==========
    # Block access to hidden files
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to sensitive files
    location ~* \.(env|log|conf|ini|bak|sql|sh|key)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Disable TRACE and TRACK HTTP methods
    if ($request_method ~ ^(TRACE|TRACK)$) {
        return 405;
    }
}