# Run as a less privileged user for security purposes
user  nginx;

# Auto-detect number of CPU cores
worker_processes  auto;

# Maximum number of open files per worker process
worker_rlimit_nofile 65535;

# Error logging
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Events configuration
events {
    # Maximum number of simultaneous connections per worker
    worker_connections  4096;
    
    # Optimize for many connections
    use epoll;
    
    # Accept as many connections as possible
    multi_accept on;
}

http {
    # MIME types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" "$request_time"';

    # Access log configuration
    access_log  /var/log/nginx/access.log  main buffer=512k flush=1m;
    
    # Performance optimizations
    sendfile           on;
    sendfile_max_chunk 1m;
    tcp_nopush        on;
    tcp_nodelay       on;
    
    # Timeouts
    keepalive_timeout  30;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Buffer size optimizations
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 1k;
    
    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;
    
    # Cache information about frequently accessed files
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 5;
    open_file_cache_errors off;
    
    # Security headers (will be overridden in server block if needed)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Include other config files
    include /etc/nginx/conf.d/*.conf;
}
